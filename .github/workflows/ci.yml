name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Neovim
        env:
          NEOVIM_VERSION: v0.12.5
          NEOVIM_SHA256: bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875
        run: |
          archive="$RUNNER_TEMP/nvim-linux-x86_64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/neovim/neovim/releases/download/$NEOVIM_VERSION/nvim-linux-x86_64.tar.gz"
          echo "$NEOVIM_SHA256  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Run regression tests
        run: |
          nvim --clean --headless -i NONE -l tests/run.lua
          nvim --clean --headless -i NONE -l tests/lifecycle.lua
      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@7b4006562fec80e637cdc03897f45fe48e38b7de # v2
        with:
          version: v0.20.0
          token: ${{ github.token }}
          args: --check lua tests
